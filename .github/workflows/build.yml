name: Build Manage Moho

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

           - name: Cài thư viện
        run: pip install -r requirements.txt pytest pyinstaller lupa pillow

      - name: Chạy kiểm tra tự động
        env:
          QT_QPA_PLATFORM: offscreen
          MM_NO_WEBENGINE: "1"
        run: python -m pytest -q -p no:cacheprovider

      - name: Đóng gói ứng dụng
        run: pyinstaller --noconfirm --windowed --name ManageMoho --icon assets/logo.ico --add-data "assets;assets" main.py

      - name: Cài Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Tạo bộ cài Setup.exe
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Lưu bộ cài để tải về
        uses: actions/upload-artifact@v4
        with:
          name: ManageMoho-Setup
          path: dist-installer/ManageMoho_Setup.exe
